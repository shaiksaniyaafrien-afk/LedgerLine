<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerLine — Administrator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-shield-halved text-lg"></i>
            </div>
            <div>
                <span class="text-xl font-bold tracking-tight text-white">LedgerLine</span>
                <span class="ml-2 text-xs bg-indigo-950/60 text-indigo-400 px-2 py-0.5 rounded border border-indigo-500/30">Admin Console</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <a href="/auditor" class="px-3 py-1.5 rounded-lg bg-amber-950/40 hover:bg-amber-900/50 border border-amber-500/30 text-xs font-semibold text-amber-300 transition flex items-center gap-1.5">
                <i class="fa-solid fa-magnifying-glass"></i> Auditor Portal
            </a>
            <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-slate-300 transition">
                <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Sign Out
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 space-y-6">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-white">System Accounts & Management</h1>
                <p class="text-xs text-slate-400">Total control over system accounts, status, and administration.</p>
            </div>
            <button onclick="openModal('createAccModal')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-lg shadow-indigo-600/30 flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Open New Account
            </button>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <span class="text-xs uppercase font-mono font-bold text-slate-400">All System Accounts</span>
                <button onclick="loadAccounts()" class="text-xs text-indigo-400 hover:underline"><i class="fa-solid fa-rotate-right mr-1"></i> Reload</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-950/50 text-slate-400 font-mono uppercase tracking-wider border-b border-slate-800">
                        <tr>
                            <th class="py-3 px-4">Account ID</th>
                            <th class="py-3 px-4">Account Number</th>
                            <th class="py-3 px-4">User ID</th>
                            <th class="py-3 px-4">Type</th>
                            <th class="py-3 px-4 text-right">Balance</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminAccountsBody" class="divide-y divide-slate-800/60 font-mono">
                        <tr><td colspan="7" class="py-6 text-center text-slate-500">Loading accounts...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create Account Modal -->
    <div id="createAccModal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-plus text-indigo-400"></i> Open Account
                </h3>
                <button onclick="closeModal('createAccModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleCreateAccount(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block uppercase font-semibold text-slate-400 mb-1">Target User ID (Optional)</label>
                    <input type="number" id="newAccUserId" placeholder="Leave blank for self" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white">
                </div>
                <div>
                    <label class="block uppercase font-semibold text-slate-400 mb-1">Custom Account Number (Optional)</label>
                    <input type="text" id="newAccNumber" placeholder="Leave blank to auto-generate" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white font-mono">
                </div>
                <div>
                    <label class="block uppercase font-semibold text-slate-400 mb-1">Initial Opening Deposit (INR)</label>
                    <input type="number" step="0.01" min="0" id="newAccDeposit" value="0.00" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white">
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal('createAccModal')" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold">Cancel</button>
                    <button type="submit" id="createAccBtn" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Create Account</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('ledger_token');
        if (!token) window.location.href = '/login';

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function loadAccounts() {
            try {
                const res = await fetch('/api/accounts', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load accounts');
                const accounts = await res.json();

                const tbody = document.getElementById('adminAccountsBody');
                tbody.innerHTML = accounts.map(a => `
                    <tr class="hover:bg-slate-900/60">
                        <td class="py-3 px-4 text-slate-400">#${a.id}</td>
                        <td class="py-3 px-4 font-bold text-white">${a.account_number}</td>
                        <td class="py-3 px-4 text-slate-400">${a.user_id ? 'User #' + a.user_id : 'System'}</td>
                        <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-[10px] ${a.account_type === 'SYSTEM_CLEARING' ? 'bg-indigo-950 border border-indigo-500/30 text-indigo-400' : 'bg-slate-800 text-slate-300'}">${a.account_type}</span></td>
                        <td class="py-3 px-4 text-right font-bold text-white">₹${parseFloat(a.balance).toFixed(2)}</td>
                        <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-[10px] bg-emerald-500/10 border border-emerald-500/30 text-emerald-400">${a.status}</span></td>
                        <td class="py-3 px-4">
                            <a href="/statement?account_id=${a.id}" class="text-xs text-indigo-400 hover:underline">View Statement</a>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                alert(err.message);
            }
        }

        async function handleCreateAccount(e) {
            e.preventDefault();
            const btn = document.getElementById('createAccBtn');
            btn.disabled = true;

            const uId = document.getElementById('newAccUserId').value;
            const accNum = document.getElementById('newAccNumber').value.trim();
            const dep = parseFloat(document.getElementById('newAccDeposit').value) || 0;

            try {
                const body = {
                    initial_deposit: dep,
                    currency: 'INR'
                };
                if (uId) body.user_id = parseInt(uId);
                if (accNum) body.account_number = accNum;

                const res = await fetch('/api/accounts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to create account');

                closeModal('createAccModal');
                await loadAccounts();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
            }
        }

        window.onload = loadAccounts;
    </script>
</body>
</html>
