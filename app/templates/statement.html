<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerLine — Detailed Statement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        <div class="flex items-center justify-between">
            <button onclick="history.back()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <h1 class="text-xl font-bold text-white">Full Ledger Account Statement</h1>
            <div></div>
        </div>

        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
                <span class="text-xs text-slate-400 uppercase font-mono">Account</span>
                <h2 id="stmtAccNumber" class="text-2xl font-bold font-mono text-white">ACC-XXXX</h2>
                <div id="stmtOwner" class="text-xs text-slate-400 mt-1">Owner: Loading...</div>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400 uppercase font-mono">Current Balance</span>
                <div id="stmtBalance" class="text-3xl font-extrabold font-mono text-white">₹0.00</div>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs font-mono">
                    <thead class="bg-slate-950 text-slate-400 uppercase border-b border-slate-800">
                        <tr>
                            <th class="py-3 px-4">Date</th>
                            <th class="py-3 px-4">Ref</th>
                            <th class="py-3 px-4">Type</th>
                            <th class="py-3 px-4 text-right">Amount</th>
                            <th class="py-3 px-4 text-right">Balance</th>
                            <th class="py-3 px-4">Initiated By</th>
                            <th class="py-3 px-4">Hash</th>
                        </tr>
                    </thead>
                    <tbody id="stmtBody" class="divide-y divide-slate-800">
                        <tr><td colspan="7" class="py-6 text-center text-slate-500 font-sans">Loading statement entries...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('ledger_token');
        if (!token) window.location.href = '/login';

        const urlParams = new URLSearchParams(window.location.search);
        const accountId = urlParams.get('account_id') || 1;

        async function load() {
            try {
                const res = await fetch(`/api/accounts/${accountId}/statement`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load statement');
                const data = await res.json();

                document.getElementById('stmtAccNumber').textContent = data.account_number;
                document.getElementById('stmtOwner').textContent = `Owner: ${data.owner_name}`;
                document.getElementById('stmtBalance').textContent = `₹${parseFloat(data.current_balance).toFixed(2)}`;

                const tbody = document.getElementById('stmtBody');
                if (data.statement_entries.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-slate-500 font-sans">No entries.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.statement_entries.map(e => {
                    const isCredit = e.entry_type === 'CREDIT';
                    const isRefused = e.entry_type === 'REFUSED';
                    const color = isRefused ? 'text-rose-400 line-through' : (isCredit ? 'text-emerald-400' : 'text-slate-200');
                    const sign = isRefused ? '✕' : (isCredit ? '+' : '-');

                    return `
                        <tr class="hover:bg-slate-900/60">
                            <td class="py-3 px-4 text-slate-400">${new Date(e.created_at).toLocaleString()}</td>
                            <td class="py-3 px-4 text-slate-200">${e.transaction_reference}</td>
                            <td class="py-3 px-4">
                                <span class="px-2 py-0.5 rounded text-[10px] ${isRefused ? 'bg-rose-950 text-rose-400 border border-rose-500/30' : (isCredit ? 'bg-emerald-950 text-emerald-400' : 'bg-blue-950 text-blue-400')}">
                                    ${e.entry_type}
                                </span>
                                ${e.refusal_reason ? `<div class="text-[10px] text-rose-400 mt-0.5">${e.refusal_reason}</div>` : ''}
                            </td>
                            <td class="py-3 px-4 text-right font-bold ${color}">${sign} ₹${parseFloat(e.amount).toFixed(2)}</td>
                            <td class="py-3 px-4 text-right text-white font-bold">₹${parseFloat(e.running_balance).toFixed(2)}</td>
                            <td class="py-3 px-4 text-slate-400 font-sans">${e.initiated_by_name}</td>
                            <td class="py-3 px-4 text-slate-500 text-[10px]">${e.entry_hash.substring(0, 12)}...</td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                alert(err.message);
            }
        }

        window.onload = load;
    </script>
</body>
</html>
